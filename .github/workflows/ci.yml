name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: Pull request template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate pull request body
        run: python desktop/scripts/validate_pr_body.py "$GITHUB_EVENT_PATH"

  backend:
    name: Backend and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: binhu_online_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_PASSWORD: test-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests
        working-directory: backend
      - name: Check property annotation workbook and permission contracts
        run: python -m pytest tests/test_property_annotation_xlsx.py tests/test_household_cancellation_status.py tests/test_household_multi_file_import.py tests/test_household_preview_repair.py tests/test_filtered_xlsx_exports.py tests/test_registry_foundation.py tests/test_registry_visit_history.py tests/test_help_docs.py -q
        working-directory: backend
      - name: Create split test databases
        run: |
          for db in binhu_platform_test binhu_workflow_test; do
            mysql -h 127.0.0.1 -uroot -ptest-password -e "CREATE DATABASE IF NOT EXISTS $db"
          done
      - name: Run process engine split-domain integration test
        env:
          APP_ENVIRONMENT: development
          SESSION_COOKIE_NAME: binhu_dev_session
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
          MYSQL_ONLINE_DATA_DB: binhu_online_test
          MYSQL_PLATFORM_DB: binhu_platform_test
          MYSQL_WORKFLOW_DB: binhu_workflow_test
          PLATFORM_DOMAIN_ACTIVE: "true"
          RUN_PROCESS_ENGINE_MYSQL_INTEGRATION: "1"
          ENCRYPTION_KEY: test-encryption-key
        run: python -m pytest tests/test_process_engine_mysql_integration.py -q
        working-directory: backend

  hotfix-candidate:
    name: Prebuild backend hotfix candidate
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Build and verify exact commit candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          commit="$(git rev-parse HEAD)"
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p hotfix-candidate context
          git archive --format=tar.gz --output=hotfix-candidate/source.tar.gz HEAD VERSION backend
          tar -xzf hotfix-candidate/source.tar.gz -C context
          cp context/VERSION context/backend/VERSION
          printf '\nENV APP_VERSION=%s\n' "$version" >> context/backend/Dockerfile
          artifact_id="$(sha256sum hotfix-candidate/source.tar.gz | awk '{print $1}')"
          image_tag="binhu-hotfix-candidate:$commit"
          docker build --pull=false \
            --label "binhu.artifact.id=$artifact_id" \
            --label "org.opencontainers.image.revision=$commit" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image_tag" -f context/backend/Dockerfile context/backend
          image_id="$(docker image inspect --format '{{.Id}}' "$image_tag")"
          [[ "$image_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker image inspect "$image_tag" | python -c 'import json,sys; i=json.load(sys.stdin)[0]; l=i["Config"]["Labels"]; e={"binhu.artifact.id":sys.argv[1],"org.opencontainers.image.revision":sys.argv[2],"org.opencontainers.image.version":sys.argv[3]}; assert i["Id"]==sys.argv[4] and all(l.get(k)==v for k,v in e.items())' "$artifact_id" "$commit" "$version" "$image_id"
          docker image save "$image_tag" | gzip -1 > hotfix-candidate/image.tar.gz
          CANDIDATE_COMMIT="$commit" CANDIDATE_VERSION="$version" \
            CANDIDATE_ARTIFACT_ID="$artifact_id" CANDIDATE_IMAGE_ID="$image_id" python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('hotfix-candidate')
          files = {}
          for name in ('source.tar.gz', 'image.tar.gz'):
              data = (root / name).read_bytes()
              files[name] = {'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)}
          payload = {
              'schema': 1, 'commit': os.environ['CANDIDATE_COMMIT'],
              'version': os.environ['CANDIDATE_VERSION'], 'release_scope': 'backend',
              'ready_for_hotfix': True, 'artifact_id': os.environ['CANDIDATE_ARTIFACT_ID'],
              'image_id': os.environ['CANDIDATE_IMAGE_ID'], 'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(payload, sort_keys=True, indent=2) + '\n')
          PY
          (cd hotfix-candidate && sha256sum source.tar.gz image.tar.gz > SHA256SUMS)
      - name: Upload reusable hotfix candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binhu-hotfix-candidate-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: hotfix-candidate
          retention-days: 30

      - name: Run deployment tests
        run: python -m unittest discover -s deploy/tests
      - name: Validate Docker Compose configuration
        env:
          BINHU_MYSQL_ROOT_PASSWORD: compose-validation
          BINHU_MYSQL_PASSWORD: compose-validation
          BINHU_REDIS_PASSWORD: compose-validation
          BINHU_ENCRYPTION_KEY: compose-validation
          BINHU_OPS_AGENT_TOKEN: compose-validation
        run: docker compose config --quiet
      - name: Run release notes tests
        run: python -m unittest desktop/scripts/test_generate_release_notes.py
      - name: Run desktop update gateway tests
        run: python -m unittest discover -s desktop/server/tests
      - name: Compile Python sources
        run: |
          python -m compileall -q .
          python -m compileall -q ../deploy
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Vite currently needs more than the default ~2 GiB Node heap on the
      # hosted runner while rendering the full application bundle.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Run autosave browser regression tests
        # Exercise real React editors against fictional, intercepted API responses.
        # Browser binaries are kept outside the dependency lockfile.
        run: npx playwright install --with-deps chromium && npm run test:autosave:browser
        working-directory: frontend
      - name: Check pending registration free-address editing
        run: npm run test:pending-registration:browser
        working-directory: frontend
      # Keep pointer capture and touch-drag behavior under real browser coverage.
      - name: Run floating actions browser regression tests
        run: npm run test:floating:browser
        working-directory: frontend
      - name: Check background request budgets in browser
        run: npm run test:background:browser
        working-directory: frontend
      - name: Check date navigation across session refreshes
        run: npm run test:date-range:browser
        working-directory: frontend
      - name: Check property annotation preview and confirmation in browser
        run: node tests/propertyAnnotation.browser.mjs
        working-directory: frontend
      - name: Check household multi-file import in browser
        run: node tests/householdImport.browser.mjs
        working-directory: frontend
      - name: Build frontend production bundle
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
        working-directory: frontend

  desktop:
    name: Desktop clients
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
            desktop/apps/win10-tauri/package-lock.json
      - name: Build local desktop frontend
        shell: pwsh
        env:
          # Keep the Windows hosted runner from failing at Vite chunk rendering
          # before the desktop architecture checks can run.
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm.cmd ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_OPTIONS = '--max-old-space-size=8192'
          npm.cmd run build --prefix frontend -- --mode desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & desktop/scripts/build-local-frontend.ps1 -SkipBuild -FrontendDist frontend/dist
      - name: Test and validate desktop architecture
        shell: pwsh
        run: |
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD = '1'
          npm.cmd ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run version:check --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run validate --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Tauri client
        shell: pwsh
        run: |
          npm.cmd ci --prefix desktop/apps/win10-tauri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run tauri:fmt --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run tauri:check --prefix desktop
