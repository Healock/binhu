name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: Pull request template
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate pull request body
        run: python desktop/scripts/validate_pr_body.py "$GITHUB_EVENT_PATH"

  backend:
    name: Backend and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MYSQL_PASSWORD: test-password
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests
        working-directory: backend

  hotfix-candidate:
    name: Prebuild backend hotfix candidate
    if: github.event_name == 'pull_request'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Build candidate archive
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p hotfix-candidate
          git archive --format=tar.gz --output=hotfix-candidate/source.tar.gz HEAD VERSION backend deploy
          sha256sum hotfix-candidate/source.tar.gz > hotfix-candidate/SHA256SUMS
          CANDIDATE_COMMIT='${{ github.event.pull_request.head.sha }}' python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          source = Path('hotfix-candidate/source.tar.gz')
          payload = {
              'schema': 1,
              'commit': os.environ['CANDIDATE_COMMIT'],
              'version': Path('VERSION').read_text().strip(),
              'release_scope': 'backend',
              'ready_for_hotfix': True,
              'sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
          }
          Path('hotfix-candidate/manifest.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY
      - name: Upload reusable hotfix candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binhu-hotfix-candidate-${{ github.sha }}
          path: hotfix-candidate
          retention-days: 30
      - name: Run deployment tests
        run: python -m unittest discover -s deploy/tests
      - name: Validate Docker Compose configuration
        env:
          BINHU_MYSQL_ROOT_PASSWORD: compose-validation
          BINHU_MYSQL_PASSWORD: compose-validation
          BINHU_REDIS_PASSWORD: compose-validation
          BINHU_ENCRYPTION_KEY: compose-validation
          BINHU_OPS_AGENT_TOKEN: compose-validation
        run: docker compose config --quiet
      - name: Run release notes tests
        run: python -m unittest desktop/scripts/test_generate_release_notes.py
      - name: Run desktop update gateway tests
        run: python -m unittest discover -s desktop/server/tests
      - name: Compile Python sources
        run: |
          python -m compileall -q .
          python -m compileall -q ../deploy
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Vite currently needs more than the default ~2 GiB Node heap on the
      # hosted runner while rendering the full application bundle.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npm test
        working-directory: frontend
      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build
        working-directory: frontend

  desktop:
    name: Desktop clients
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
            desktop/apps/win10-tauri/package-lock.json
      - name: Build local desktop frontend
        shell: pwsh
        env:
          # Keep the Windows hosted runner from failing at Vite chunk rendering
          # before the desktop architecture checks can run.
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          npm.cmd ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NODE_OPTIONS = '--max-old-space-size=8192'
          npm.cmd run build --prefix frontend -- --mode desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & desktop/scripts/build-local-frontend.ps1 -SkipBuild -FrontendDist frontend/dist
      - name: Test and validate desktop architecture
        shell: pwsh
        run: |
          $env:ELECTRON_SKIP_BINARY_DOWNLOAD = '1'
          npm.cmd ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd test --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run version:check --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run validate --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Tauri client
        shell: pwsh
        run: |
          npm.cmd ci --prefix desktop/apps/win10-tauri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run tauri:fmt --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run tauri:check --prefix desktop
