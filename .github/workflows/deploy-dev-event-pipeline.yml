name: Deploy Dev event pipeline
run-name: Deploy Dev event pipeline ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Prepared Dev run ID (dev-YYYYMMDD-...)
        required: true
        type: string
      artifact_run_id:
        description: Prepare Dev event-pipeline workflow run ID
        required: true
        type: string
      commit:
        description: Full merged commit SHA in the candidate manifest
        required: true
        type: string
      bundle_sha256:
        description: SHA-256 of the candidate bundle
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-dev-event-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    steps:
      - name: Download immutable candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v7.0.0
        with:
          name: binhu-dev-event-pipeline-${{ inputs.run_id }}-${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifact_run_id }}
          path: candidate
      - name: Verify candidate digest and identity
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.bundle_sha256 }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RUN_ID" =~ ^dev-[0-9]{8}-[A-Za-z0-9][A-Za-z0-9_-]{3,31}$ ]]
          bundle="candidate/binhu-dev-event-pipeline.tar.gz"
          [[ -f "$bundle" ]]
          [[ "$(sha256sum "$bundle" | awk '{print $1}')" == "$EXPECTED_SHA256" ]]
          printf '%s\n' "$EXPECTED_SHA256  $bundle" > candidate/verified-SHA256SUMS
      - name: Prepare, measure and apply through fixed Dev gateway
        shell: bash
        env:
          DEV_HOST: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_HOST }}
          DEV_KEY: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_SSH_KEY }}
          DEV_KNOWN_HOSTS: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_KNOWN_HOSTS }}
          RUN_ID: ${{ inputs.run_id }}
          COMMIT: ${{ inputs.commit }}
          BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEV_HOST" && -n "$DEV_KEY" && -n "$DEV_KNOWN_HOSTS" ]]
          install -d -m 700 "$RUNNER_TEMP/dev-ssh"
          printf '%s\n' "$DEV_KEY" > "$RUNNER_TEMP/dev-ssh/key"
          printf '%s\n' "$DEV_KNOWN_HOSTS" > "$RUNNER_TEMP/dev-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/dev-ssh/key" "$RUNNER_TEMP/dev-ssh/known_hosts"
          bundle="candidate/binhu-dev-event-pipeline.tar.gz"
          size="$(wc -c < "$bundle")"
          cat "$bundle" | ssh -i "$RUNNER_TEMP/dev-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dev-ssh/known_hosts" "binhu-dev-deploy@$DEV_HOST" "prepare $RUN_ID $COMMIT $size $BUNDLE_SHA256"
          ssh -i "$RUNNER_TEMP/dev-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dev-ssh/known_hosts" "binhu-dev-deploy@$DEV_HOST" "measure $RUN_ID"
          ssh -i "$RUNNER_TEMP/dev-ssh/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dev-ssh/known_hosts" "binhu-dev-deploy@$DEV_HOST" "apply $RUN_ID"
          rm -f "$RUNNER_TEMP/dev-ssh/key" "$RUNNER_TEMP/dev-ssh/known_hosts"
