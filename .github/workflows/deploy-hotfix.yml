name: Deploy accepted Staging candidate as emergency hotfix
run-name: Hotfix ${{ inputs.hotfix_id }} from ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit already merged into main
        required: true
        default: main
        type: string
      run_id:
        description: Accepted Staging application candidate
        required: true
        type: string
      expected_version:
        description: Exact VERSION of the selected main commit
        required: true
        type: string
      hotfix_id:
        description: Emergency change tracking ID, for example HF-20261027-12
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate emergency change ID
        env:
          HOTFIX_ID: ${{ inputs.hotfix_id }}
        run: |
          set -Eeuo pipefail
          [[ "$HOTFIX_ID" =~ ^HF-[0-9]{8}-[0-9]{1,6}$ ]]
  promote:
    needs: validate
    uses: ./.github/workflows/deploy-production.yml
    with:
      ref: ${{ inputs.ref }}
      run_id: ${{ inputs.run_id }}
      expected_version: ${{ inputs.expected_version }}
    secrets: inherit
