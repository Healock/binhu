name: Deploy production
run-name: Deploy ${{ inputs.expected_version }} from ${{ inputs.ref }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref already merged into main
        required: true
        default: main
        type: string
      expected_version:
        description: Exact VERSION expected at the selected ref
        required: true
        type: string
      backup_scope:
        description: Database backup required before switching the application
        required: true
        default: online
        type: choice
        options:
          - none
          - online
          - daily
          - all

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, package and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      MYSQL_PASSWORD: test-password
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      BACKUP_SCOPE: ${{ inputs.backup_scope }}
    steps:
      - name: Check out selected source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify release identity and main ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          release_commit="$(git rev-parse HEAD)"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$release_commit" origin/main
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$EXPECTED_VERSION" ]]
          printf 'RELEASE_COMMIT=%s\n' "$release_commit" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Run backend tests and compile Python
        working-directory: backend
        run: |
          python -m unittest discover -s tests
          python -m compileall -q .
          python -m compileall -q ../deploy
      - name: Run deployment tests
        run: python -m unittest discover -s deploy/tests
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Build commit-bound release bundle
        run: |
          mkdir -p release-output
          python deploy/build_release_bundle.py \
            --repository . \
            --frontend-dist frontend/dist \
            --commit "$RELEASE_COMMIT" \
            --backup-scope "$BACKUP_SCOPE" \
            --output release-output/binhu-release.tar.gz
      - name: Preserve release bundle for audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binhu-${{ inputs.expected_version }}-${{ github.run_id }}
          path: release-output/binhu-release.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Prepare restricted SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.BINHU_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BINHU_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/binhu-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/binhu-ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/binhu-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/binhu-ssh/deploy_key" "$RUNNER_TEMP/binhu-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/binhu-ssh/deploy_key" >/dev/null
          [[ -s "$RUNNER_TEMP/binhu-ssh/known_hosts" ]]
      - name: Deploy through the fixed server gateway
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BINHU_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BINHU_DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          ssh -F /dev/null \
            -i "$RUNNER_TEMP/binhu-ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/binhu-ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$DEPLOY_PORT" \
            "binhu-deploy@$DEPLOY_HOST" \
            "deploy $EXPECTED_VERSION $RELEASE_COMMIT $BACKUP_SCOPE" \
            < release-output/binhu-release.tar.gz
      - name: Verify the public health endpoint
        shell: bash
        env:
          PUBLIC_URL: ${{ secrets.BINHU_PUBLIC_URL }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 10); do
            if payload="$(curl --fail --silent --show-error --max-time 15 \
              "${PUBLIC_URL%/}/api/health")" \
              && python -c \
                'import json,sys; raise SystemExit(0 if json.loads(sys.argv[1]).get("version") == sys.argv[2] else 1)' \
                "$payload" "$EXPECTED_VERSION"
            then
              exit 0
            fi
            sleep 6
          done
          echo "Public health verification failed." >&2
          exit 1
