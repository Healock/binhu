name: Deploy Production
run-name: Promote Staging ${{ inputs.run_id }} to Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit already merged into main
        required: true
        default: main
        type: string
      run_id:
        description: Accepted Staging application candidate
        required: true
        type: string
      expected_version:
        description: Exact VERSION of the selected main commit
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      run_id:
        required: true
        type: string
      expected_version:
        required: true
        type: string
    secrets:
      BINHU_DEPLOY_SSH_KEY:
        required: true
      BINHU_DEPLOY_KNOWN_HOSTS:
        required: true
      BINHU_DEPLOY_HOST:
        required: true
      BINHU_DEPLOY_PORT:
        required: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and promote accepted Staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      STAGING_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Check out selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify main ancestry and same-commit Production config
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          release_commit="$(git rev-parse HEAD)"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$release_commit" origin/main
          [[ "$STAGING_RUN_ID" =~ ^staging-app-[0-9a-f]{16}$ ]]
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "$EXPECTED_VERSION" ]]
          compose_sha256="$(sha256sum docker-compose.yml | awk '{print $1}')"
          compose_size="$(wc -c < docker-compose.yml | tr -d ' ')"
          [[ "$compose_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$compose_size" =~ ^[1-9][0-9]{0,6}$ ]] && (( compose_size <= 1048576 ))
          {
            printf 'RELEASE_COMMIT=%s\n' "$release_commit"
            printf 'PRODUCTION_COMPOSE_SHA256=%s\n' "$compose_sha256"
            printf 'PRODUCTION_COMPOSE_SIZE=%s\n' "$compose_size"
          } >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install deployment test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
      - name: Run deployment contract tests
        run: |
          python -m unittest discover -s deploy/tests
          python -m compileall -q deploy
      - name: Prepare restricted SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.BINHU_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BINHU_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/binhu-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/binhu-ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/binhu-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/binhu-ssh/deploy_key" "$RUNNER_TEMP/binhu-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/binhu-ssh/deploy_key" >/dev/null
          [[ -s "$RUNNER_TEMP/binhu-ssh/known_hosts" ]]
      - name: Promote through the fixed Production gateway
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BINHU_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BINHU_DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 ))
          started="$(date +%s)"
          ssh -F /dev/null \
            -i "$RUNNER_TEMP/binhu-ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/binhu-ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -p "$DEPLOY_PORT" \
            "binhu-deploy@$DEPLOY_HOST" \
            "promote $EXPECTED_VERSION $STAGING_RUN_ID $RELEASE_COMMIT $PRODUCTION_COMPOSE_SHA256 $PRODUCTION_COMPOSE_SIZE" \
            < docker-compose.yml
          elapsed=$(( $(date +%s) - started ))
          printf 'Accepted Staging candidate %s promoted in %ss with backup_scope=all\n' "$STAGING_RUN_ID" "$elapsed"
