name: Install Staging promotion gateways

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-staging-promotion-gateways
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify immutable main revision
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Configure SSH
        env:
          ADMIN_KEY: ${{ secrets.BINHU_STAGING_ADMIN_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BINHU_STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ADMIN_KEY" > ~/.ssh/staging-admin
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/staging-admin ~/.ssh/known_hosts
      - name: Install fixed gateways
        env:
          HOST: ${{ secrets.BINHU_STAGING_HOST }}
          PORT: ${{ secrets.BINHU_STAGING_PORT }}
          APP_PUBLIC_KEY: ${{ secrets.BINHU_STAGING_APP_DEPLOY_PUBLIC_KEY }}
          DATA_PUBLIC_KEY: ${{ secrets.BINHU_STAGING_DATA_DEPLOY_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 ))
          package="$RUNNER_TEMP/staging-gateway-install"
          install -d -m 700 "$package/deploy"
          cp deploy/__init__.py "$package/deploy/__init__.py"
          cp -a deploy/environments "$package/deploy/environments"
          printf '%s\n' "$APP_PUBLIC_KEY" > "$package/staging-app.pub"
          printf '%s\n' "$DATA_PUBLIC_KEY" > "$package/staging-data.pub"
          printf '%s\n' "$GITHUB_SHA" > "$package/staging-control-commit"
          tar -C "$package" -czf "$RUNNER_TEMP/staging-promotion-gateways.tar.gz" \
            deploy staging-app.pub staging-data.pub staging-control-commit
          cat "$RUNNER_TEMP/staging-promotion-gateways.tar.gz" | ssh -p "$PORT" -i ~/.ssh/staging-admin \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "root@$HOST" 'set -euo pipefail; d=$(mktemp -d /tmp/binhu-staging-gateways.XXXXXX); trap '\''rm -rf "$d"'\'' EXIT; tar -xzf - -C "$d"; cd "$d"; bash ./deploy/environments/install-staging-promotion-gateways.sh ./staging-app.pub ./staging-data.pub ./staging-control-commit'
      - name: Verify fixed status and rejection boundaries
        env:
          HOST: ${{ secrets.BINHU_STAGING_HOST }}
          PORT: ${{ secrets.BINHU_STAGING_PORT }}
          APP_KEY: ${{ secrets.BINHU_STAGING_APP_SSH_KEY }}
          DATA_KEY: ${{ secrets.BINHU_STAGING_DATA_SSH_KEY }}
        run: |
          set -euo pipefail
          [[ "$PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$PORT >= 1 && 10#$PORT <= 65535 ))
          printf '%s\n' "$APP_KEY" > ~/.ssh/staging-app
          printf '%s\n' "$DATA_KEY" > ~/.ssh/staging-data
          chmod 600 ~/.ssh/staging-app ~/.ssh/staging-data
          app=(ssh -p "$PORT" -i ~/.ssh/staging-app -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "binhu-staging-app-deploy@$HOST")
          data=(ssh -p "$PORT" -i ~/.ssh/staging-data -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "binhu-staging-data-deploy@$HOST")

          # The fixed SSH port is fronted by a tunnel that can reset a fresh
          # KEX while the root install session is being released.  Retry only
          # the read-only status probe, with bounded backoff; mutating gateway
          # actions and boundary checks remain single-attempt operations.
          status_retry_delays=(2 4 8 12 20)
          run_status_with_retry() {
            local label="$1"
            shift
            local attempt=1
            local delay
            local rc=1
            for delay in "${status_retry_delays[@]}"; do
              if "$@"; then
                echo "$label status passed (attempt $attempt)"
                return 0
              else
                rc=$?
              fi
              if (( attempt == ${#status_retry_delays[@]} )); then
                echo "::error::$label status failed after $attempt attempts" >&2
                return "$rc"
              fi
              echo "::warning::$label status connection failed (attempt $attempt); retrying after ${delay}s" >&2
              sleep "$delay"
              ((attempt += 1))
            done
          }

          run_status_with_retry app "${app[@]}" status
          run_status_with_retry data "${data[@]}" status
          ! "${app[@]}" 'apply production deadbeef'
          ! "${app[@]}" 'sh -c id'
          ! "${data[@]}" 'switch production'
          ! "${data[@]}" 'create development'
          ! "${data[@]}" 'cat /srv/binhu/compose.yml'
