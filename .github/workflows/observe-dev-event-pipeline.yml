name: Control Dev event pipeline
run-name: Control Dev event pipeline ${{ inputs.action }} ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: Observe or control the fixed Development event-pipeline run
        required: true
        type: choice
        options:
          - start
          - status
          - gateway-status
          - pause
          - resume
      run_id:
        description: Current Dev event-pipeline run ID (required except for gateway-status)
        required: false
        type: string
      observation_id:
        description: Immutable observation ID for start/status, obs-YYYYMMDD-name
        required: false
        type: string
      pause_id:
        description: Immutable pause ID for pause/resume, dev-pause-YYYYMMDD-name
        required: false
        type: string

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: development
    steps:
      - name: Run fixed Dev observation command
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          RUN_ID: ${{ inputs.run_id }}
          OBSERVATION_ID: ${{ inputs.observation_id }}
          PAUSE_ID: ${{ inputs.pause_id }}
          DEV_HOST: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_HOST }}
          DEV_PORT: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_PORT }}
          DEV_KEY: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_SSH_KEY }}
          DEV_KNOWN_HOSTS: ${{ secrets.BINHU_DEV_EVENT_PIPELINE_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DEV_HOST" && "$DEV_PORT" =~ ^[0-9]+$ && -n "$DEV_KEY" && -n "$DEV_KNOWN_HOSTS" ]]
          install -d -m 700 "$RUNNER_TEMP/dev-ssh"
          printf '%s\n' "$DEV_KEY" > "$RUNNER_TEMP/dev-ssh/key"
          printf '%s\n' "$DEV_KNOWN_HOSTS" > "$RUNNER_TEMP/dev-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/dev-ssh/key" "$RUNNER_TEMP/dev-ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/dev-ssh/key" "$RUNNER_TEMP/dev-ssh/known_hosts"' EXIT
          ssh_args=(-p "$DEV_PORT" -i "$RUNNER_TEMP/dev-ssh/key" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/dev-ssh/known_hosts")
          case "$ACTION" in
            start|status)
              [[ "$RUN_ID" =~ ^dev-[0-9]{8}-[A-Za-z0-9][A-Za-z0-9_-]{3,31}$ ]]
              [[ "$OBSERVATION_ID" =~ ^obs-[0-9]{8}-[A-Za-z0-9][A-Za-z0-9_-]{3,31}$ ]]
              [[ -z "$PAUSE_ID" ]]
              command="observe-$ACTION $RUN_ID $OBSERVATION_ID"
              ;;
            gateway-status)
              [[ -z "$RUN_ID" && -z "$OBSERVATION_ID" && -z "$PAUSE_ID" ]]
              command=status
              ;;
            pause|resume)
              [[ "$RUN_ID" =~ ^dev-[0-9]{8}-[A-Za-z0-9][A-Za-z0-9_-]{3,31}$ ]]
              [[ "$PAUSE_ID" =~ ^dev-pause-[0-9]{8}-[A-Za-z0-9][A-Za-z0-9_-]{3,31}$ ]]
              [[ -z "$OBSERVATION_ID" ]]
              command="$ACTION $RUN_ID $PAUSE_ID"
              ;;
            *)
              exit 64
              ;;
          esac
          ssh "${ssh_args[@]}" "binhu-dev-deploy@$DEV_HOST" "$command"
