name: Production maintenance
run-name: Production maintenance ${{ inputs.operation }} ${{ inputs.phase }} ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Registered maintenance operation
        required: true
        type: choice
        options:
          - internal-department-retirement
          - photo-sheet-retirement
          - registry-property-identity
      phase:
        description: Maintenance phase
        required: true
        type: choice
        options: [measure, backup, apply, verify, rollback]
      run_id:
        description: Immutable evidence run id
        required: true
        type: string
      expected_count:
        description: Count confirmed from measure (retirement operations only)
        required: false
        type: string
      old_property_id:
        description: Old property id (registry identity operation only)
        required: false
        type: string
      canonical_property_id:
        description: Current property id (registry identity operation only)
        required: false
        type: string
      measurement_hash:
        description: Exact measurement hash from the latest evidence (apply or rollback)
        required: false
        type: string
      confirmation:
        description: Explicit confirmation for destructive apply or rollback
        required: false
        type: choice
        options:
          - none
          - confirm-remove-internal
          - confirm-empty-photo-tables
          - confirm-registry-property-identity
          - confirm-registry-property-identity-rollback
        default: none

permissions:
  contents: read

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Prepare restricted SSH identity
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.BINHU_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BINHU_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/binhu-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/binhu-ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/binhu-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/binhu-ssh/deploy_key" "$RUNNER_TEMP/binhu-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/binhu-ssh/deploy_key" >/dev/null
      - name: Validate maintenance contract inputs
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          PHASE: ${{ inputs.phase }}
          RUN_ID: ${{ inputs.run_id }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          OLD_PROPERTY_ID: ${{ inputs.old_property_id }}
          CANONICAL_PROPERTY_ID: ${{ inputs.canonical_property_id }}
          MEASUREMENT_HASH: ${{ inputs.measurement_hash }}
          CONFIRMATION: ${{ inputs.confirmation }}
          INITIATED_BY: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          [[ "$OPERATION" =~ ^(internal-department-retirement|photo-sheet-retirement|registry-property-identity)$ ]]
          [[ "$PHASE" =~ ^(measure|backup|apply|verify|rollback)$ ]]
          [[ "$RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$ ]]
          if [[ "$OPERATION" == registry-property-identity ]]; then
            [[ -z "$EXPECTED_COUNT" ]]
            [[ "$INITIATED_BY" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,99}$ ]]
            valid_property_id() {
              [[ "$1" =~ ^[1-9][0-9]{0,18}$ ]] &&
                python3 -c 'import sys; sys.exit(0 if int(sys.argv[1]) <= 9223372036854775807 else 1)' "$1"
            }
            case "$PHASE" in
              measure|verify)
                valid_property_id "$OLD_PROPERTY_ID"
                valid_property_id "$CANONICAL_PROPERTY_ID"
                [[ -z "$MEASUREMENT_HASH" && "$CONFIRMATION" == none ]]
                ;;
              backup)
                [[ -z "$OLD_PROPERTY_ID" && -z "$CANONICAL_PROPERTY_ID" && -z "$MEASUREMENT_HASH" && "$CONFIRMATION" == none ]]
                ;;
              apply)
                valid_property_id "$OLD_PROPERTY_ID"
                valid_property_id "$CANONICAL_PROPERTY_ID"
                [[ "$MEASUREMENT_HASH" =~ ^[0-9a-f]{64}$ ]]
                [[ "$CONFIRMATION" == confirm-registry-property-identity ]]
                ;;
              rollback)
                valid_property_id "$OLD_PROPERTY_ID"
                valid_property_id "$CANONICAL_PROPERTY_ID"
                [[ "$MEASUREMENT_HASH" =~ ^[0-9a-f]{64}$ ]]
                [[ "$CONFIRMATION" == confirm-registry-property-identity-rollback ]]
                ;;
            esac
          else
            [[ "$PHASE" != rollback ]]
            [[ -z "$OLD_PROPERTY_ID" && -z "$CANONICAL_PROPERTY_ID" && -z "$MEASUREMENT_HASH" ]]
            if [[ "$PHASE" == apply ]]; then
              [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]]
              if [[ "$OPERATION" == internal-department-retirement ]]; then
                [[ "$CONFIRMATION" == confirm-remove-internal ]]
              else
                [[ "$CONFIRMATION" == confirm-empty-photo-tables ]]
              fi
            else
              [[ -z "$EXPECTED_COUNT" && "$CONFIRMATION" == none ]]
            fi
          fi
      - name: Run fixed production maintenance gateway
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BINHU_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.BINHU_DEPLOY_PORT }}
          OPERATION: ${{ inputs.operation }}
          PHASE: ${{ inputs.phase }}
          RUN_ID: ${{ inputs.run_id }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          OLD_PROPERTY_ID: ${{ inputs.old_property_id }}
          CANONICAL_PROPERTY_ID: ${{ inputs.canonical_property_id }}
          MEASUREMENT_HASH: ${{ inputs.measurement_hash }}
          CONFIRMATION: ${{ inputs.confirmation }}
          INITIATED_BY: ${{ github.actor }}
        run: |
          set -Eeuo pipefail
          command=(production-maintenance "$OPERATION" "$PHASE" "$RUN_ID")
          if [[ "$OPERATION" == registry-property-identity ]]; then
            case "$PHASE" in
              measure|verify) command+=("$OLD_PROPERTY_ID" "$CANONICAL_PROPERTY_ID" "$INITIATED_BY") ;;
              backup) command+=("$INITIATED_BY") ;;
              apply|rollback) command+=("$OLD_PROPERTY_ID" "$CANONICAL_PROPERTY_ID" "$MEASUREMENT_HASH" "$CONFIRMATION" "$INITIATED_BY") ;;
            esac
          elif [[ "$PHASE" == apply ]]; then
            command+=("$EXPECTED_COUNT" "$CONFIRMATION")
          fi
          ssh -F /dev/null \
            -i "$RUNNER_TEMP/binhu-ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/binhu-ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 -p "$DEPLOY_PORT" \
            "binhu-deploy@$DEPLOY_HOST" "${command[@]}"
