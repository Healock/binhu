name: Rehearse Staging event pipeline rollback
run-name: Rehearse Staging rollback ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id: {description: "Applied STG-YYYYMMDD-NN run", required: true, type: string}

permissions:
  contents: read

concurrency:
  group: staging-event-pipeline-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Switch to Python worker through the fixed Staging gateway
        shell: bash
        env:
          HOST: ${{ secrets.BINHU_STAGING_EVENT_PIPELINE_HOST }}
          PORT: ${{ secrets.BINHU_STAGING_EVENT_PIPELINE_PORT }}
          KEY: ${{ secrets.BINHU_STAGING_EVENT_PIPELINE_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BINHU_STAGING_EVENT_PIPELINE_KNOWN_HOSTS }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -Eeuo pipefail
          [[ "$RUN_ID" =~ ^STG-[0-9]{8}-[0-9]{2}$ ]]
          install -d -m 700 "$RUNNER_TEMP/staging-ssh" "$RUNNER_TEMP/staging-rollback"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/staging-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/staging-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/staging-ssh/"*
          ssh -p "$PORT" -i "$RUNNER_TEMP/staging-ssh/key" -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/staging-ssh/known_hosts" \
            "binhu-staging-deploy@$HOST" "rollback $RUN_ID" \
            > "$RUNNER_TEMP/staging-rollback/rollback-report.json"
          python - <<'PY'
          import json, os
          path=os.path.join(os.environ['RUNNER_TEMP'],'staging-rollback','rollback-report.json')
          data=json.load(open(path,encoding='utf-8'))
          required={'environment':'staging','status':'passed','python_worker_restored':True,
                    'data_consistency_verified':True,'legacy_path_healthy':True}
          if any(data.get(key)!=value for key,value in required.items()):
              raise SystemExit('Staging rollback rehearsal failed')
          print(json.dumps({'rollback':'passed','elapsed_seconds':data.get('elapsed_seconds')}))
          PY
          rm -f "$RUNNER_TEMP/staging-ssh/key" "$RUNNER_TEMP/staging-ssh/known_hosts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-rollback-${{ inputs.run_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-rollback/rollback-report.json
          if-no-files-found: error
          retention-days: 14
