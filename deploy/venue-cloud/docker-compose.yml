services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    env_file:
      - /etc/binhu-venue/mysql.env
    environment:
      MYSQL_DATABASE: BinhuVenueCloud
      MYSQL_USER: binhu_venue
    volumes:
      - /srv/binhu-venue/mysql:/var/lib/mysql
    networks:
      - venue_private
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  receiver:
    image: binhu-venue-receiver:${BINHU_VENUE_IMAGE_TAG:?Set BINHU_VENUE_IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - /etc/binhu-venue/receiver.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: binhu_venue
      MYSQL_DATABASE: BinhuVenueCloud
      PHOTO_DIR: /data/photos
      ENCRYPTION_PUBLIC_KEY_DIR: /run/secrets/venue-encryption-public
      INTERNAL_REQUEST_PUBLIC_KEY_PATH: /run/secrets/local-request-signing.pub
      INTERNAL_RESPONSE_PRIVATE_KEY_PATH: /run/secrets/cloud-response-signing.key
      REQUIRE_MTLS_HEADER: "true"
      ALLOW_INSECURE_INTERNAL_TESTS: "false"
    volumes:
      - /srv/binhu-venue/photos:/data/photos
      - /etc/binhu-venue/venue-encryption-public:/run/secrets/venue-encryption-public:ro
      - /etc/binhu-venue/local-request-signing.pub:/run/secrets/local-request-signing.pub:ro
      - /etc/binhu-venue/cloud-response-signing.key:/run/secrets/cloud-response-signing.key:ro
    networks:
      - venue_private
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:48727/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  ingress:
    image: binhu-venue-receiver:${BINHU_VENUE_IMAGE_TAG:?Set BINHU_VENUE_IMAGE_TAG}
    restart: unless-stopped
    command: ["python", "-m", "app.ingress_proxy"]
    environment:
      INGRESS_TARGET_HOST: receiver
      INGRESS_TARGET_PORT: 48727
    ports:
      - "127.0.0.1:48727:48727"
    networks:
      - venue_private
      - venue_ingress
    depends_on:
      receiver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 48727), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  venue_private:
    internal: true
  venue_ingress:
    driver: bridge
