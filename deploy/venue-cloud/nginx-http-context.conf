# Include once inside nginx.conf's http {} block.
limit_req_zone $binary_remote_addr zone=binhu_venue_public_ip:10m rate=30r/m;
map $uri $binhu_venue_redacted_uri {
    ~^/venue/ /venue/[redacted];
    ~^/api/public/venues/ /api/public/venues/[redacted];
    default $uri;
}
log_format binhu_venue_redacted '$remote_addr - $remote_user [$time_local] '
    '"$request_method $binhu_venue_redacted_uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';
