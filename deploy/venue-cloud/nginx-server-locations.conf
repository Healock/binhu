# Include inside the existing venue cloud HTTPS server block. Keep /updates/ unchanged.
ssl_client_certificate /etc/binhu-venue/mtls-ca.pem;
ssl_verify_client optional;

location ^~ /venue/ {
    limit_req zone=binhu_venue_public_ip burst=10 nodelay;
    access_log /www/wwwlogs/binhu-venue-access.log binhu_venue_redacted;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:48727;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Server;
    client_max_body_size 6m;
}

location ^~ /api/public/ {
    limit_req zone=binhu_venue_public_ip burst=10 nodelay;
    access_log /www/wwwlogs/binhu-venue-access.log binhu_venue_redacted;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:48727;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Server;
    client_max_body_size 6m;
}

location ^~ /api/internal/ {
    if ($ssl_client_verify != SUCCESS) { return 403; }
    access_log /www/wwwlogs/binhu-venue-internal.log binhu_venue_redacted;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:48727;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Binhu-Client-Verify $ssl_client_verify;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Server;
    proxy_read_timeout 40s;
    client_max_body_size 6m;
}
