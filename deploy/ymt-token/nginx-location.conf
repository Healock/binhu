# Include inside the existing HTTPS server block. Do not alter the separate
# /ymt/ymt-latest.js exact-match location.
location = /ymt/token {
    limit_except POST GET { deny all; }
    proxy_pass http://127.0.0.1:48728/ymt/token;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_no_cache 1;
    add_header Cache-Control "no-store" always;
}

location = /ymt/token/health {
    proxy_pass http://127.0.0.1:48728/ymt/token/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}
