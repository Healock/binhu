[package]
name = "binhu-win10-tauri"
version = "0.25.19"
description = "Binhu desktop shell for Windows 10 and later"
authors = ["滨湖新城派出所"]
edition = "2021"

[lib]
name = "binhu_win10_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = "=1.2.110-ge826545"
ureq = "3.4"
