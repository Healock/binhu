server {
    listen 80;
    listen [::]:80;
    server_name 47.100.44.36;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/binhu-acme;
        default_type text/plain;
    }

    location / { return 404; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 47.100.44.36;

    ssl_certificate /etc/letsencrypt/live/47.100.44.36/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.100.44.36/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BinhuUpdates:10m;

    location ~ "^/updates/(win7-x64|win10-x64|android-arm64)/((?:releases|manifest|policy)\.stable\.json)$" {
        alias /srv/binhu-updates/public/$1/$2;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/updates/(win7-x64|win10-x64|android-arm64)/([A-Za-z0-9][A-Za-z0-9._+\-]{0,199})$" {
        alias /srv/binhu-updates/public/$1/$2;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / { return 404; }
}
