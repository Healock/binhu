services:
  redis:
    # Pin this tag to the verified registry digest during deployment.
    image: redis:7.4.2
    container_name: binhu-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${BINHU_REDIS_PASSWORD:?Set BINHU_REDIS_PASSWORD in .env}", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${BINHU_REDIS_PASSWORD:?Set BINHU_REDIS_PASSWORD in .env}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: binhu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BINHU_MYSQL_ROOT_PASSWORD:?Set BINHU_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: OnlineData
      MYSQL_USER: ${BINHU_MYSQL_USER:-binhu}
      MYSQL_PASSWORD: ${BINHU_MYSQL_PASSWORD:?Set BINHU_MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: binhu-backend
    container_name: binhu-backend
    restart: unless-stopped
    dns:
      - 119.29.29.29
      - 223.5.5.5
    ports:
      - "127.0.0.1:37125:37125"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${BINHU_MYSQL_USER:-binhu}
      MYSQL_PASSWORD: ${BINHU_MYSQL_PASSWORD:?Set BINHU_MYSQL_PASSWORD in .env}
      MYSQL_POOL_SIZE: 10
      REDIS_URL: redis://:${BINHU_REDIS_PASSWORD:?Set BINHU_REDIS_PASSWORD in .env}@redis:6379/0
      MYSQL_ONLINE_DATA_DB: OnlineData
      MYSQL_ARCHIVE_DB: OnlineDataArchive
      MYSQL_DAILY_REPORT_DB: daily_report
      MYSQL_PLATFORM_DB: PlatformData
      MYSQL_VISIT_DB: VisitData
      MYSQL_DISPATCH_DB: DispatchData
      MYSQL_REGISTRY_DB: RegistryData
      MYSQL_WORKFLOW_DB: WorkflowData
      MYSQL_DOMAIN_DATABASES_ENABLED: ${BINHU_DOMAIN_DATABASES_ENABLED:-true}
      PLATFORM_DOMAIN_ACTIVE: ${BINHU_PLATFORM_DOMAIN_ACTIVE:-false}
      VISIT_DOMAIN_ACTIVE: ${BINHU_VISIT_DOMAIN_ACTIVE:-false}
      DISPATCH_DOMAIN_ACTIVE: ${BINHU_DISPATCH_DOMAIN_ACTIVE:-false}
      DAILY_DOMAIN_ACTIVE: ${BINHU_DAILY_DOMAIN_ACTIVE:-false}
      REGISTRY_ADDRESS_DOMAIN_ACTIVE: ${BINHU_REGISTRY_ADDRESS_DOMAIN_ACTIVE:-false}
      REGISTRY_FEATURE_ENABLED: ${BINHU_REGISTRY_FEATURE_ENABLED:-false}
      WORKFLOW_FEATURE_ENABLED: ${BINHU_WORKFLOW_FEATURE_ENABLED:-false}
      WINDOWS_MIN_SUPPORTED_VERSION: ${BINHU_WINDOWS_MIN_SUPPORTED_VERSION:-0.0.0}
      ANDROID_MIN_SUPPORTED_VERSION: ${BINHU_ANDROID_MIN_SUPPORTED_VERSION:-0.0.0}
      CLIENT_WRITE_VERSION_ENFORCEMENT_ENABLED: ${BINHU_CLIENT_WRITE_VERSION_ENFORCEMENT_ENABLED:-true}
      CLIENT_WRITE_IDENTIFICATION_REQUIRED: ${BINHU_CLIENT_WRITE_IDENTIFICATION_REQUIRED:-false}
      TXDOCS_DAILY_REQUEST_LIMIT: ${BINHU_TXDOCS_DAILY_REQUEST_LIMIT:-20000}
      LOCAL_DATA_SOURCE_ENABLED: ${BINHU_LOCAL_DATA_SOURCE_ENABLED:-true}
      TXDOCS_ENABLED: ${BINHU_TXDOCS_ENABLED:-false}
      TXDOCS_MIGRATION_MODE: ${BINHU_TXDOCS_MIGRATION_MODE:-readonly}
      TXDOCS_CUTOFF_AT: ${BINHU_TXDOCS_CUTOFF_AT:-}
      ENCRYPTION_KEY: ${BINHU_ENCRYPTION_KEY:?Set BINHU_ENCRYPTION_KEY in .env}
      REGISTRY_HMAC_KEY: ${BINHU_REGISTRY_HMAC_KEY:-}
      SESSION_COOKIE_SECURE: ${BINHU_SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAMESITE: ${BINHU_SESSION_COOKIE_SAMESITE:-none}
      MULTI_DEVICE_SESSION_ENABLED: ${BINHU_MULTI_DEVICE_SESSION_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${BINHU_CORS_ALLOWED_ORIGINS:-http://tauri.localhost,https://tauri.localhost,binhu://app}
      PUBLIC_WEB_BASE_URL: ${BINHU_PUBLIC_WEB_BASE_URL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BINHU_BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BINHU_BOOTSTRAP_ADMIN_PASSWORD:-}
      OPS_AGENT_URL: http://ops-agent:9001
      OPS_AGENT_TOKEN: ${BINHU_OPS_AGENT_TOKEN:?Set BINHU_OPS_AGENT_TOKEN in .env}
      BACKUP_DIR: /app/backups
      WORKFLOW_ATTACHMENT_DIR: /app/workflow-attachments
      WORKFLOW_PHOTO_IMPORT_DIR: /app/workflow-photo-imports
      USER_AVATAR_DIR: /app/user-avatars
      FULLCHAIN_ARCHIVE_DIR: /app/fullchain-archives
      POLICE_DISPATCH_IMPORT_DIR: /app/police-dispatch-imports
      VISIT_SOURCE_BASE_URL: ${BINHU_VISIT_SOURCE_BASE_URL:-}
      VISIT_SOURCE_AUTHORIZATION: ${BINHU_VISIT_SOURCE_AUTHORIZATION:-}
      VISIT_SOURCE_USERNAME: ${BINHU_VISIT_SOURCE_USERNAME:-}
      VISIT_SOURCE_PASSWORD: ${BINHU_VISIT_SOURCE_PASSWORD:-}
      VISIT_SOURCE_DETAIL_FIELD_MAP: ${BINHU_VISIT_SOURCE_DETAIL_FIELD_MAP:-}
      VISIT_SOURCE_RATING_FIELD_MAP: ${BINHU_VISIT_SOURCE_RATING_FIELD_MAP:-}
      VISIT_SOURCE_MOCK: ${BINHU_VISIT_SOURCE_MOCK:-false}
      VISIT_SOURCE_AUTO_CONFIRM: ${BINHU_VISIT_SOURCE_AUTO_CONFIRM:-false}
      CERTIFICATE_IMAGE_BASE_URL: ${BINHU_CERTIFICATE_IMAGE_BASE_URL:-}
      CERTIFICATE_SOURCE_DAILY_ENABLED: ${BINHU_CERTIFICATE_SOURCE_DAILY_ENABLED:-false}
      CERTIFICATE_SOURCE_DAILY_TIME: ${BINHU_CERTIFICATE_SOURCE_DAILY_TIME:-02:30}
      QMF_PREVIEW_ENABLED: ${BINHU_QMF_PREVIEW_ENABLED:-false}
      QMF_REGISTRATION_ENABLED: ${BINHU_QMF_REGISTRATION_ENABLED:-false}
      QMF_API_BASE_URL: ${BINHU_QMF_API_BASE_URL:-}
      QMF_LOGIN_HOST: ${BINHU_QMF_LOGIN_HOST:-}
      QMF_LOGIN_PORT: ${BINHU_QMF_LOGIN_PORT:-0}
      QMF_SOURCE_USERNAME: ${BINHU_QMF_SOURCE_USERNAME:-}
      QMF_SOURCE_PASSWORD: ${BINHU_QMF_SOURCE_PASSWORD:-}
      QMF_SOURCE_ACQUISITION_ENABLED: ${BINHU_QMF_SOURCE_ACQUISITION_ENABLED:-false}
      QMF_SOURCE_BASE_URL: ${BINHU_QMF_SOURCE_BASE_URL:-}
      QMF_SOURCE_TIMEOUT_SECONDS: ${BINHU_QMF_SOURCE_TIMEOUT_SECONDS:-30}
      QMF_SOURCE_MAX_PAGES: ${BINHU_QMF_SOURCE_MAX_PAGES:-1000}
      QMF_SOURCE_MAX_RECORDS: ${BINHU_QMF_SOURCE_MAX_RECORDS:-100000}
      QMF_SOURCE_AUTO_SYNC: ${BINHU_QMF_SOURCE_AUTO_SYNC:-true}
      QMF_SOURCE_IMEI: ${BINHU_QMF_SOURCE_IMEI:-}
      QMF_SOURCE_MACHINE_UID: ${BINHU_QMF_SOURCE_MACHINE_UID:-}
      QMF_EXPECTED_STATION_CODE: ${BINHU_QMF_EXPECTED_STATION_CODE:-320584710000}
      QMF_EXPECTED_STATION_NAME: ${BINHU_QMF_EXPECTED_STATION_NAME:-滨湖新城派出所}
      QMF_TIMEOUT_SECONDS: ${BINHU_QMF_TIMEOUT_SECONDS:-15}
      QMF_PREVIEW_COOLDOWN_SECONDS: ${BINHU_QMF_PREVIEW_COOLDOWN_SECONDS:-45}
      QMF_LOGIN_PROTOCOL_VERIFIED: ${BINHU_QMF_LOGIN_PROTOCOL_VERIFIED:-false}
      QMF_WRITE_PROTOCOL_VERIFIED: ${BINHU_QMF_WRITE_PROTOCOL_VERIFIED:-false}
      QMF_STATUS_SCAN_ENABLED: ${BINHU_QMF_STATUS_SCAN_ENABLED:-false}
      QMF_STATUS_SCAN_TIME: ${BINHU_QMF_STATUS_SCAN_TIME:-}
      STATIC_DIR: /app/static
    volumes:
      - ./frontend/dist:/app/static:ro
      - ./VERSION:/app/VERSION:ro
      - ${BINHU_BACKUP_DIR:-./backups}:/app/backups
      - ${BINHU_WORKFLOW_ATTACHMENT_DIR:-/data/binhu/workflow-attachments}:/app/workflow-attachments
      - ${BINHU_WORKFLOW_PHOTO_IMPORT_DIR:-/data/binhu/workflow-photo-imports}:/app/workflow-photo-imports
      - ${BINHU_USER_AVATAR_DIR:-/data/binhu/user-avatars}:/app/user-avatars
      - ${BINHU_FULLCHAIN_ARCHIVE_DIR:-/data/binhu/fullchain-archives}:/app/fullchain-archives
      - ${BINHU_POLICE_DISPATCH_IMPORT_DIR:-/data/binhu/police-dispatch-imports}:/app/police-dispatch-imports
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ops-agent:
        condition: service_healthy

  event-relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: binhu-backend
    container_name: binhu-event-relay
    restart: unless-stopped
    command: ["python", "-m", "services.redis_relay"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${BINHU_MYSQL_USER:-binhu}
      MYSQL_PASSWORD: ${BINHU_MYSQL_PASSWORD:?Set BINHU_MYSQL_PASSWORD in .env}
      MYSQL_POOL_SIZE: 3
      MYSQL_ONLINE_DATA_DB: OnlineData
      MYSQL_PLATFORM_DB: PlatformData
      REDIS_URL: redis://:${BINHU_REDIS_PASSWORD:?Set BINHU_REDIS_PASSWORD in .env}@redis:6379/0
      REDIS_STREAM_KEY: binhu:events
      REDIS_PUBSUB_CHANNEL: binhu:events:published
      REALTIME_EVENTS_ENABLED: ${BINHU_REALTIME_EVENTS_ENABLED:-true}
      ENCRYPTION_KEY: ${BINHU_ENCRYPTION_KEY:?Set BINHU_ENCRYPTION_KEY in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  diagnostic-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: binhu-backend
    container_name: binhu-diagnostic-worker
    restart: unless-stopped
    command: ["python", "-m", "services.diagnostic_worker"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${BINHU_MYSQL_USER:-binhu}
      MYSQL_PASSWORD: ${BINHU_MYSQL_PASSWORD:?Set BINHU_MYSQL_PASSWORD in .env}
      MYSQL_POOL_SIZE: 3
      MYSQL_ONLINE_DATA_DB: OnlineData
      MYSQL_PLATFORM_DB: PlatformData
      MYSQL_DOMAIN_DATABASES_ENABLED: ${BINHU_DOMAIN_DATABASES_ENABLED:-true}
      REDIS_URL: redis://:${BINHU_REDIS_PASSWORD:?Set BINHU_REDIS_PASSWORD in .env}@redis:6379/0
      ENCRYPTION_KEY: ${BINHU_ENCRYPTION_KEY:?Set BINHU_ENCRYPTION_KEY in .env}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ops-agent:
    image: binhu-backend
    container_name: binhu-ops-agent
    restart: unless-stopped
    command: ["uvicorn", "ops_agent:app", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      OPS_AGENT_TOKEN: ${BINHU_OPS_AGENT_TOKEN:?Set BINHU_OPS_AGENT_TOKEN in .env}
      OPS_AGENT_CONTAINERS: backend=binhu-backend,mysql=binhu-mysql
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "9001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mysql_data:
  redis_data:
