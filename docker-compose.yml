services:
  mysql:
    image: mysql:8.0
    container_name: binhu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BINHU_MYSQL_ROOT_PASSWORD:?Set BINHU_MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: OnlineData
      MYSQL_USER: ${BINHU_MYSQL_USER:-binhu}
      MYSQL_PASSWORD: ${BINHU_MYSQL_PASSWORD:?Set BINHU_MYSQL_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: binhu-backend
    container_name: binhu-backend
    restart: unless-stopped
    dns:
      - 119.29.29.29
      - 223.5.5.5
    ports:
      - "127.0.0.1:37125:37125"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${BINHU_MYSQL_USER:-binhu}
      MYSQL_PASSWORD: ${BINHU_MYSQL_PASSWORD:?Set BINHU_MYSQL_PASSWORD in .env}
      MYSQL_POOL_SIZE: 10
      MYSQL_ONLINE_DATA_DB: OnlineData
      MYSQL_ARCHIVE_DB: OnlineDataArchive
      MYSQL_DAILY_REPORT_DB: daily_report
      MYSQL_PLATFORM_DB: PlatformData
      MYSQL_VISIT_DB: VisitData
      MYSQL_DISPATCH_DB: DispatchData
      MYSQL_REGISTRY_DB: RegistryData
      MYSQL_WORKFLOW_DB: WorkflowData
      MYSQL_DOMAIN_DATABASES_ENABLED: ${BINHU_DOMAIN_DATABASES_ENABLED:-true}
      PLATFORM_DOMAIN_ACTIVE: ${BINHU_PLATFORM_DOMAIN_ACTIVE:-false}
      VISIT_DOMAIN_ACTIVE: ${BINHU_VISIT_DOMAIN_ACTIVE:-false}
      DISPATCH_DOMAIN_ACTIVE: ${BINHU_DISPATCH_DOMAIN_ACTIVE:-false}
      DAILY_DOMAIN_ACTIVE: ${BINHU_DAILY_DOMAIN_ACTIVE:-false}
      REGISTRY_ADDRESS_DOMAIN_ACTIVE: ${BINHU_REGISTRY_ADDRESS_DOMAIN_ACTIVE:-false}
      REGISTRY_FEATURE_ENABLED: ${BINHU_REGISTRY_FEATURE_ENABLED:-false}
      WORKFLOW_FEATURE_ENABLED: ${BINHU_WORKFLOW_FEATURE_ENABLED:-false}
      WINDOWS_MIN_SUPPORTED_VERSION: ${BINHU_WINDOWS_MIN_SUPPORTED_VERSION:-0.0.0}
      ANDROID_MIN_SUPPORTED_VERSION: ${BINHU_ANDROID_MIN_SUPPORTED_VERSION:-0.0.0}
      CLIENT_WRITE_VERSION_ENFORCEMENT_ENABLED: ${BINHU_CLIENT_WRITE_VERSION_ENFORCEMENT_ENABLED:-true}
      CLIENT_WRITE_IDENTIFICATION_REQUIRED: ${BINHU_CLIENT_WRITE_IDENTIFICATION_REQUIRED:-false}
      ENCRYPTION_KEY: ${BINHU_ENCRYPTION_KEY:?Set BINHU_ENCRYPTION_KEY in .env}
      REGISTRY_HMAC_KEY: ${BINHU_REGISTRY_HMAC_KEY:-}
      SESSION_COOKIE_SECURE: ${BINHU_SESSION_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${BINHU_CORS_ALLOWED_ORIGINS:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BINHU_BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BINHU_BOOTSTRAP_ADMIN_PASSWORD:-}
      OPS_AGENT_URL: http://ops-agent:9001
      OPS_AGENT_TOKEN: ${BINHU_OPS_AGENT_TOKEN:?Set BINHU_OPS_AGENT_TOKEN in .env}
      BACKUP_DIR: /app/backups
      WORKFLOW_ATTACHMENT_DIR: /app/workflow-attachments
      WORKFLOW_PHOTO_IMPORT_DIR: /app/workflow-photo-imports
      USER_AVATAR_DIR: /app/user-avatars
      VISIT_SOURCE_BASE_URL: ${BINHU_VISIT_SOURCE_BASE_URL:-}
      VISIT_SOURCE_AUTHORIZATION: ${BINHU_VISIT_SOURCE_AUTHORIZATION:-}
      VISIT_SOURCE_DETAIL_FIELD_MAP: ${BINHU_VISIT_SOURCE_DETAIL_FIELD_MAP:-}
      VISIT_SOURCE_RATING_FIELD_MAP: ${BINHU_VISIT_SOURCE_RATING_FIELD_MAP:-}
      VISIT_SOURCE_MOCK: ${BINHU_VISIT_SOURCE_MOCK:-false}
      VISIT_SOURCE_AUTO_CONFIRM: ${BINHU_VISIT_SOURCE_AUTO_CONFIRM:-false}
      STATIC_DIR: /app/static
    volumes:
      - ./frontend/dist:/app/static:ro
      - ./VERSION:/app/VERSION:ro
      - ${BINHU_BACKUP_DIR:-./backups}:/app/backups
      - ${BINHU_WORKFLOW_ATTACHMENT_DIR:-/data/binhu/workflow-attachments}:/app/workflow-attachments
      - ${BINHU_WORKFLOW_PHOTO_IMPORT_DIR:-/data/binhu/workflow-photo-imports}:/app/workflow-photo-imports
      - ${BINHU_USER_AVATAR_DIR:-/data/binhu/user-avatars}:/app/user-avatars
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      ops-agent:
        condition: service_healthy

  ops-agent:
    image: binhu-backend
    container_name: binhu-ops-agent
    restart: unless-stopped
    command: ["uvicorn", "ops_agent:app", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      OPS_AGENT_TOKEN: ${BINHU_OPS_AGENT_TOKEN:?Set BINHU_OPS_AGENT_TOKEN in .env}
      OPS_AGENT_CONTAINERS: backend=binhu-backend,mysql=binhu-mysql
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "9001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mysql_data:
