name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME=binhu-loadtest-<run_id>}

services:
  mysql:
    image: ${SHADOW_MYSQL_IMAGE:?Pin the verified MySQL image}
    environment:
      MYSQL_ROOT_PASSWORD: ${SHADOW_MYSQL_ROOT_PASSWORD:?Set a shadow-only root password}
      MYSQL_DATABASE: ${SHADOW_DB_NAME:?Set a non-production database name}
      SHADOW_DAILY_DB_NAME: ${SHADOW_DAILY_DB_NAME:?Set a separate shadow daily-report database name}
      MYSQL_USER: ${SHADOW_DB_USER:?Set a shadow-only database user}
      MYSQL_PASSWORD: ${SHADOW_DB_PASSWORD:?Set a shadow-only database password}
    command: ["mysqld", "--max_connections=151", "--innodb_buffer_pool_size=1G"]
    ports: ["127.0.0.1:47126:3306"]
    volumes:
      - shadow_mysql_data:/var/lib/mysql
      - ./shadow-marker.sql:/docker-entrypoint-initdb.d/00-shadow-marker.sql:ro
      - ./shadow-schema-bootstrap.sh:/docker-entrypoint-initdb.d/01-shadow-schema-bootstrap.sh:ro
      - ../backend/init.sql:/shadow-schema/backend-init.sql:ro
    networks: [shadow]
    cpus: 4
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${SHADOW_REDIS_IMAGE:?Pin the verified Redis image}
    command: ["redis-server", "--requirepass", "${SHADOW_REDIS_PASSWORD:?Set a shadow-only Redis password}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [shadow_redis_data:/data]
    networks: [shadow]
    cpus: 0.5
    mem_limit: 256m

  backend:
    image: ${SHADOW_BACKEND_IMAGE:?Pass the exact verified 0.28.3 backend image ID}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
      ops-agent: {condition: service_healthy}
    ports: ["127.0.0.1:47125:37125"]
    environment:
      APP_ENVIRONMENT: shadow
      APP_ENVIRONMENT_LABEL: 影子压测环境
      LOAD_TEST_RUN_ID: ${LOAD_TEST_RUN_ID:?Set the run id}
      APP_VERSION: "0.28.3"
      MYSQL_DOMAIN_DATABASES_ENABLED: "true"
      PLATFORM_DOMAIN_ACTIVE: "true"
      # The first shadow readiness pass exercises platform and online-task
      # paths.  Keep the daily-report domain separate so its snapshot refresh
      # DML/DDL cannot queue behind online task writes.
      VISIT_DOMAIN_ACTIVE: "false"
      DISPATCH_DOMAIN_ACTIVE: "false"
      DAILY_DOMAIN_ACTIVE: "true"
      REGISTRY_ADDRESS_DOMAIN_ACTIVE: "false"
      SESSION_COOKIE_NAME: binhu_shadow_session
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: none
      CORS_ALLOWED_ORIGINS: "http://tauri.localhost,https://tauri.localhost,binhu://app"
      OPS_AGENT_URL: http://ops-agent:9001
      OPS_AGENT_TOKEN: ${SHADOW_OPS_AGENT_TOKEN:?Set a shadow-only operations token}
      BOOTSTRAP_ADMIN_USERNAME: observer@shadow
      BOOTSTRAP_ADMIN_PASSWORD: ${SHADOW_BOOTSTRAP_PASSWORD:?Set a temporary shadow bootstrap password}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${SHADOW_DB_USER}
      MYSQL_PASSWORD: ${SHADOW_DB_PASSWORD}
      MYSQL_ONLINE_DATA_DB: ${SHADOW_DB_NAME}
      MYSQL_ARCHIVE_DB: ${SHADOW_DB_NAME}
      MYSQL_DAILY_REPORT_DB: ${SHADOW_DAILY_DB_NAME:?Set a separate shadow daily-report database name}
      MYSQL_PLATFORM_DB: ${SHADOW_DB_NAME}
      MYSQL_VISIT_DB: ${SHADOW_DB_NAME}
      MYSQL_DISPATCH_DB: ${SHADOW_DB_NAME}
      MYSQL_REGISTRY_DB: ${SHADOW_DB_NAME}
      MYSQL_WORKFLOW_DB: ${SHADOW_DB_NAME}
      REDIS_URL: redis://:${SHADOW_REDIS_PASSWORD}@redis:6379/0
      ENCRYPTION_KEY: ${SHADOW_ENCRYPTION_KEY:?Set a shadow-only encryption key}
      LOCAL_DATA_SOURCE_ENABLED: "true"
      TXDOCS_ENABLED: "false"
      QMF_SOURCE_ACQUISITION_ENABLED: "false"
      QMF_REGISTRATION_ENABLED: "false"
      VENUE_CLOUD_SYNC_ENABLED: "false"
      VENUE_CLOUD_PULL_ENABLED: "false"
      CERTIFICATE_SOURCE_DAILY_ENABLED: "false"
      VISIT_SOURCE_BASE_URL: ""
      QMF_SOURCE_BASE_URL: ""
      PUBLIC_WEB_BASE_URL: ""
    volumes:
      - ./:/load-tests:ro
    networks: [shadow]
    cpus: 2
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:37125/api/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 30

  ops-agent:
    image: ${SHADOW_BACKEND_IMAGE:?Pass the exact verified 0.28.3 backend image ID}
    command: ["uvicorn", "ops_agent:app", "--host", "0.0.0.0", "--port", "9001"]
    environment:
      OPS_AGENT_TOKEN: ${SHADOW_OPS_AGENT_TOKEN:?Set a shadow-only operations token}
      OPS_AGENT_CONTAINERS: backend=${COMPOSE_PROJECT_NAME}-backend-1,mysql=${COMPOSE_PROJECT_NAME}-mysql-1,redis=${COMPOSE_PROJECT_NAME}-redis-1
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose: ["9001"]
    networks: [shadow]
    cpus: 0.25
    mem_limit: 192m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9001/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  shadow:
    name: ${COMPOSE_PROJECT_NAME}-network
    internal: true

volumes:
  shadow_mysql_data:
    name: ${COMPOSE_PROJECT_NAME}-mysql
  shadow_redis_data:
    name: ${COMPOSE_PROJECT_NAME}-redis
