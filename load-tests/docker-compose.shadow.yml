name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME=binhu-loadtest-<run_id>}

services:
  mysql:
    image: ${SHADOW_MYSQL_IMAGE:?Pin the verified MySQL image}
    environment:
      MYSQL_ROOT_PASSWORD: ${SHADOW_MYSQL_ROOT_PASSWORD:?Set a shadow-only root password}
      MYSQL_DATABASE: ${SHADOW_DB_NAME:?Set a non-production database name}
      MYSQL_USER: ${SHADOW_DB_USER:?Set a shadow-only database user}
      MYSQL_PASSWORD: ${SHADOW_DB_PASSWORD:?Set a shadow-only database password}
    command: ["mysqld", "--max_connections=151", "--innodb_buffer_pool_size=1G"]
    volumes:
      - shadow_mysql_data:/var/lib/mysql
      - ./shadow-marker.sql:/docker-entrypoint-initdb.d/00-shadow-marker.sql:ro
    networks: [shadow]
    cpus: 4
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${SHADOW_REDIS_IMAGE:?Pin the verified Redis image}
    command: ["redis-server", "--requirepass", "${SHADOW_REDIS_PASSWORD:?Set a shadow-only Redis password}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [shadow_redis_data:/data]
    networks: [shadow]
    cpus: 0.5
    mem_limit: 256m

  backend:
    image: ${SHADOW_BACKEND_IMAGE:?Pass the exact verified 0.28.2 backend image ID}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["127.0.0.1:47125:37125"]
    environment:
      APP_ENVIRONMENT: shadow
      APP_ENVIRONMENT_LABEL: 影子压测环境
      LOAD_TEST_RUN_ID: ${LOAD_TEST_RUN_ID:?Set the run id}
      SESSION_COOKIE_NAME: binhu_shadow_session
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${SHADOW_DB_USER}
      MYSQL_PASSWORD: ${SHADOW_DB_PASSWORD}
      MYSQL_ONLINE_DATA_DB: ${SHADOW_DB_NAME}
      MYSQL_ARCHIVE_DB: ${SHADOW_DB_NAME}
      MYSQL_DAILY_REPORT_DB: ${SHADOW_DB_NAME}
      MYSQL_PLATFORM_DB: ${SHADOW_DB_NAME}
      MYSQL_VISIT_DB: ${SHADOW_DB_NAME}
      MYSQL_DISPATCH_DB: ${SHADOW_DB_NAME}
      MYSQL_REGISTRY_DB: ${SHADOW_DB_NAME}
      REDIS_URL: redis://:${SHADOW_REDIS_PASSWORD}@redis:6379/0
      ENCRYPTION_KEY: ${SHADOW_ENCRYPTION_KEY:?Set a shadow-only encryption key}
      LOCAL_DATA_SOURCE_ENABLED: "true"
      TXDOCS_ENABLED: "false"
      QMF_SOURCE_ACQUISITION_ENABLED: "false"
      QMF_REGISTRATION_ENABLED: "false"
      VENUE_CLOUD_SYNC_ENABLED: "false"
      VENUE_CLOUD_PULL_ENABLED: "false"
      CERTIFICATE_SOURCE_DAILY_ENABLED: "false"
      VISIT_SOURCE_BASE_URL: ""
      QMF_SOURCE_BASE_URL: ""
      PUBLIC_WEB_BASE_URL: ""
    networks: [shadow]
    cpus: 2
    mem_limit: 768m

  event-relay:
    image: ${SHADOW_EVENT_RELAY_IMAGE:?Pin a shadow-only event relay image}
    networks: [shadow]
    command: ["sh", "-c", "exec sleep infinity"]
    cpus: 1
    mem_limit: 256m

networks:
  shadow:
    name: ${COMPOSE_PROJECT_NAME}-network
    internal: true

volumes:
  shadow_mysql_data:
    name: ${COMPOSE_PROJECT_NAME}-mysql
  shadow_redis_data:
    name: ${COMPOSE_PROJECT_NAME}-redis
