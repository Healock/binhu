[package]
name = "binhu-android-tauri"
version = "0.27.0"
description = "Binhu Android client shell"
authors = ["滨湖新城派出所"]
edition = "2021"

[lib]
name = "binhu_android_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
fs2 = "0.4.3"
futures-util = "0.3.31"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-opener = "2.5.4"
tokio = { version = "1.47.1", features = ["fs", "io-util", "sync", "time"] }
