server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 公安预处理请求可能携带敏感业务筛选；重定向层也不记录完整 URI。
    location ^~ /api/police-dispatch/ {
        access_log off;
        return 308 https://$host$uri$is_args$args;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # 部署时把实际证书软链接到这个稳定目录，不在仓库中保存服务器地址。
    ssl_certificate /etc/nginx/ssl/binhu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/binhu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BINHU_TLS:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 影子压测环境默认关闭；启动独立影子 Backend 后，本机 47125 才会接受请求。
    # 连接失败统一转为结构化 503，客户端禁止回退正式 API。
    location ^~ /shadow-api/events/ {
        rewrite ^/shadow-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:47125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shadow_environment_offline;
    }

    location = /shadow-api/admin/ops/logs/stream {
        rewrite ^/shadow-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:47125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shadow_environment_offline;
    }

    location ^~ /shadow-api/ {
        rewrite ^/shadow-api/(.*)$ /api/$1 break;
        proxy_pass http://127.0.0.1:47125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 201m;
        client_body_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @shadow_environment_offline;
    }

    location @shadow_environment_offline {
        default_type application/json;
        return 503 '{"code":"shadow_environment_offline","message":"影子压测环境当前未开启"}';
    }

    # 日志流必须关闭代理缓冲，浏览器才能实时收到新行。
    location = /api/admin/ops/logs/stream {
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # 走访明细 XLSX 上传单独放宽大小和处理时间，其他 API 保持默认限制。
    location = /api/visits/imports/detail {
        # 多出的 1MB 用于 multipart 请求头；后端仍严格限制文件本身为 20MB。
        client_max_body_size 21m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 照片批次后端允许 200MB ZIP；额外 1MB 用于 multipart 边界和请求头。
    location = /api/workflow/photo-imports/preview {
        client_max_body_size 201m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 自购自住名单后端允许 100MB ZIP；额外 1MB 用于 multipart 边界和请求头。
    location = /api/qmf-source/self-owned/import {
        client_max_body_size 101m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/workflow/photo-imports/[0-9]+/confirm$ {
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 户号表与告知书会处理数万条来源记录，预览和确认允许等待五分钟；
    # 后端仍在事务中校验并写入 RegistryData，不放宽其他 API。
    location ~ ^/api/registry/imports/(households|certificates)/ {
        client_max_body_size 51m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API 反向代理到后端
    # 头像文件后端限制为 5MB；额外 1MB 用于 multipart 边界和请求头。
    location = /api/auth/avatar {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 公安预处理的关键词改走请求体；这一组接口同时关闭访问日志，避免旧客户端
    # 查询串以及上传路径被普通访问日志长期保存。
    location ^~ /api/police-dispatch/ {
        access_log off;
        client_max_body_size 31m;
        client_body_timeout 300s;
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 一次性历史照片名单会创建上万条工单，允许维护窗口中的显式导入
    # 请求长时间运行；接口本身仍要求超级管理员权限和预览令牌。
    location = /api/workflow/photo-sheet/import {
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /api/events/ {
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 页面和静态资源也由本机后端提供。这样 nginx 不需要读取 /root 下的文件，
    # 后端仍然只允许宿主机回环地址访问。
    location / {
        proxy_pass http://127.0.0.1:37125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
