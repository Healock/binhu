# Internal environment-account adapter. The listen address is the verified
# binhu_default bridge gateway; re-check it before installation.
server {
    listen 172.18.0.1:18081;
    server_name _;

    access_log off;
    error_log /var/log/nginx/error.log warn;

    allow 172.18.0.0/16;
    deny all;

    location = /development/api/internal/environment-accounts {
        if ($request_method != GET) { return 405; }
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:48125/api/internal/environment-accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Environment-Account-Token $http_x_environment_account_token;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @environment_account_gateway_unavailable;
    }

    location = /development/api/internal/environment-accounts/reset {
        if ($request_method != POST) { return 405; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:48125/api/internal/environment-accounts/reset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Environment-Account-Token $http_x_environment_account_token;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @environment_account_gateway_unavailable;
    }

    location = /staging/api/internal/environment-accounts {
        if ($request_method != GET) { return 405; }
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:48126/api/internal/environment-accounts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Environment-Account-Token $http_x_environment_account_token;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @environment_account_gateway_unavailable;
    }

    location = /staging/api/internal/environment-accounts/reset {
        if ($request_method != POST) { return 405; }
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:48126/api/internal/environment-accounts/reset;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Environment-Account-Token $http_x_environment_account_token;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 @environment_account_gateway_unavailable;
    }

    location @environment_account_gateway_unavailable {
        default_type application/json;
        return 503 '{"code":"environment_account_gateway_unavailable","message":"环境账号服务暂时不可用"}';
    }
}
