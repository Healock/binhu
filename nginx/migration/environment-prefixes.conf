# Environment-bound frontend and API routes.
#
# The application containers serve their own frontend assets and expose their
# API at /api.  Keep the public environment prefix at the edge and strip it
# before proxying so the staging/development clients receive JSON from the
# matching backend instead of the production SPA fallback.
location /dev/api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:48125/api/;
}

location /dev/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:48125/;
}

location /staging/api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:48126/api/;
}

location /staging/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:48126/;
}
