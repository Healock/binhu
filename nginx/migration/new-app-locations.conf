# Shared application routes for the public and WireGuard-only Nginx servers.
location ^~ /shadow-api/events/ {
    rewrite ^/shadow-api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:47125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_intercept_errors on;
    error_page 502 504 = @shadow_environment_offline;
}

location ^~ /shadow-api/ {
    rewrite ^/shadow-api/(.*)$ /api/$1 break;
    proxy_pass http://127.0.0.1:47125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    client_max_body_size 201m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_intercept_errors on;
    error_page 502 504 = @shadow_environment_offline;
}

location @shadow_environment_offline {
    default_type application/json;
    return 503 '{"detail":{"code":"shadow_environment_offline","message":"影子压测环境当前未开启"}}';
}

