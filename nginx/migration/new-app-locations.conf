# Shared application routes for the public and WireGuard-only Nginx servers.
location = /api/admin/ops/logs/stream {
    proxy_pass http://127.0.0.1:37125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location = /api/visits/imports/detail {
    client_max_body_size 21m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:37125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ^~ /api/police-dispatch/ {
    access_log off;
    client_max_body_size 31m;
    client_body_timeout 300s;
    proxy_pass http://127.0.0.1:37125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /api/workflow/photo-sheet/import {
    proxy_pass http://127.0.0.1:37125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

location /api/ {
    proxy_pass http://127.0.0.1:37125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_read_timeout 120s;
}

location / {
    proxy_pass http://127.0.0.1:37125;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $binhu_forwarded_for;
    proxy_set_header X-Forwarded-Proto $binhu_forwarded_proto;
    proxy_read_timeout 120s;
}
