server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/binhu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/binhu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /api/health {
        proxy_pass http://127.0.0.1:37125;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        default_type text/plain;
        return 503 "Binhu migration maintenance\n";
    }
}
server {
    listen 10.77.0.2:18080;
    server_name _;
    location = /api/health {
        proxy_pass http://127.0.0.1:37125;
    }
    location / {
        default_type text/plain;
        return 503 "Binhu migration maintenance\n";
    }
}
