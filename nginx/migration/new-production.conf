server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/nginx/ssl/binhu/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/binhu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BINHU_TLS:10m;
    ssl_session_timeout 1d;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    set $binhu_forwarded_proto $scheme;
    set $binhu_forwarded_for $proxy_add_x_forwarded_for;
    include /etc/nginx/snippets/binhu-app-locations.conf;
}
